services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retrofit
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d retrofit"]
  api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
